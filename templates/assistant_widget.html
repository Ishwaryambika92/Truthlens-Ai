{% load static %}
<!-- TruthLens AI — Production Verification Assistant Widget -->

<!-- Floating Circular Trigger Button -->
<div class="tl-floating-trigger-container" id="floating-assistant-wrapper">
    <button type="button" class="tl-assistant-trigger-btn" id="floating-assistant-btn" aria-label="Open TruthLens Assistant" aria-expanded="false" aria-controls="assistant-chat-panel">
        <svg width="30" height="30" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 6 C28 6, 33 11, 33 19 C33 27, 20 34, 20 34 C20 34, 7 27, 7 19 C7 11, 12 6, 20 6 Z" stroke="#22d3ee" stroke-width="2" fill="#0b111e" />
            <circle cx="15" cy="18" r="2.5" fill="#22d3ee" />
            <circle cx="25" cy="18" r="2.5" fill="#22d3ee" />
            <path d="M17 24 Q20 26 23 24" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" fill="none" />
            <line x1="20" y1="6" x2="20" y2="2" stroke="#22d3ee" stroke-width="2" />
            <circle cx="20" cy="2" r="1.5" fill="#34d399" />
        </svg>
        <span class="tl-online-pulse-dot" title="Online"></span>
    </button>
</div>

<!-- Floating Assistant Chat Panel (Exact structure of 08_reference.png) -->
<div class="tl-assistant-panel" id="assistant-chat-panel" role="dialog" aria-modal="false" aria-labelledby="assistant-panel-title">
    <!-- Panel Header -->
    <div class="tl-assistant-header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="tl-header-avatar-circle">
                <svg width="20" height="20" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 6 C28 6, 33 11, 33 19 C33 27, 20 34, 20 34 C20 34, 7 27, 7 19 C7 11, 12 6, 20 6 Z" stroke="#22d3ee" stroke-width="2.2" fill="#0b111e" />
                    <circle cx="15" cy="18" r="2.2" fill="#22d3ee" />
                    <circle cx="25" cy="18" r="2.2" fill="#22d3ee" />
                    <path d="M17 23 Q20 25 23 23" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" fill="none" />
                </svg>
            </div>
            <div>
                <div class="tl-assistant-title" id="assistant-panel-title">TruthLens Assistant</div>
                <div class="tl-assistant-status">
                    <span class="tl-status-green-dot"></span> AI Verification Guide
                </div>
            </div>
        </div>

        <div style="display: flex; align-items: center; gap: 6px;">
            <button type="button" class="tl-window-btn" id="assistant-panel-minimize-btn" title="Minimize" aria-label="Minimize Assistant">
                —
            </button>
            <button type="button" class="tl-window-btn" id="assistant-panel-close-btn" title="Close" aria-label="Close Assistant">
                ✕
            </button>
        </div>
    </div>

    <!-- Message Stream -->
    <div class="tl-messages-stream" id="assistant-messages-stream" role="log" aria-live="polite">
        <!-- Welcome Initial Message -->
        <div class="tl-msg-row assistant">
            <div class="tl-msg-bubble assistant">
                <div style="font-weight: 700; color: #ffffff; margin-bottom: 6px;">👋 Welcome to TruthLens Assistant</div>
                <p style="margin: 0 0 10px 0; color: #cbd5e1; font-size: 0.88rem; line-height: 1.5;">
                    I can assist you in verifying news claims, evaluating source credibility, and explaining ML signals.
                </p>
                <div class="tl-chips-container" id="assistant-chips-row">
                    <button type="button" class="tl-prompt-chip" data-prompt="Explain how TruthLens verifies claims">
                        How does TruthLens verify claims?
                    </button>
                    <button type="button" class="tl-prompt-chip" data-prompt="Why is an assessment marked UNCERTAIN?">
                        Why is an assessment marked UNCERTAIN?
                    </button>
                    <button type="button" class="tl-prompt-chip" data-prompt="Explain ML prediction vs live evidence">
                        ML prediction vs live evidence
                    </button>
                </div>
                <div class="tl-msg-timestamp">Just now</div>
            </div>
        </div>
    </div>

    <!-- Input Footer Area -->
    <div class="tl-assistant-footer">
        <form class="tl-input-form" id="assistant-chat-form">
            <input
                type="text"
                class="tl-chat-input"
                id="assistant-chat-input"
                placeholder="Ask a question about news verification..."
                aria-label="Ask a question about news verification"
                autocomplete="off"
                required
            >
            <button type="submit" class="tl-send-btn" id="assistant-send-btn" aria-label="Send question">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </form>
        <div class="tl-footer-caption">
            Grounded in TruthLens verification signals &amp; live evidence
        </div>
    </div>
</div>

<style>
/* Floating Trigger */
.tl-floating-trigger-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 9999;
}
.tl-assistant-trigger-btn {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: #0e182a;
    border: 2px solid #22d3ee;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 16px rgba(34, 211, 238, 0.3);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 0;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    outline: none;
}
.tl-assistant-trigger-btn:hover {
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6), 0 0 20px rgba(34, 211, 238, 0.45);
}
.tl-online-pulse-dot {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #10b981;
    border: 2px solid #0e182a;
    box-shadow: 0 0 6px #10b981;
}

/* Chat Panel */
.tl-assistant-panel {
    position: fixed;
    bottom: 90px;
    right: 24px;
    width: 410px;
    max-width: calc(100vw - 32px);
    height: 580px;
    max-height: calc(100vh - 120px);
    background: #0e1726;
    border: 1px solid #1e293b;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    z-index: 9998;
    display: none;
    flex-direction: column;
    overflow: hidden;
    animation: tl-panel-pop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.tl-assistant-panel.is-open {
    display: flex;
}
@keyframes tl-panel-pop {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Header */
.tl-assistant-header {
    padding: 14px 18px;
    background: #0a111c;
    border-bottom: 1px solid #1e293b;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.tl-header-avatar-circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(34, 211, 238, 0.12);
    border: 1px solid rgba(34, 211, 238, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
}
.tl-assistant-title {
    font-size: 0.95rem;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.2;
}
.tl-assistant-status {
    font-size: 0.75rem;
    color: #34d399;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 1px;
}
.tl-status-green-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #10b981;
    display: inline-block;
}
.tl-window-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: #141f33;
    border: 1px solid #273752;
    color: #94a3b8;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    transition: all 0.15s ease;
}
.tl-window-btn:hover {
    color: #ffffff;
    border-color: #38bdf8;
    background: #1c2b48;
}

/* Stream */
.tl-messages-stream {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: #0b121e;
}
.tl-msg-row {
    display: flex;
    width: 100%;
}
.tl-msg-row.user {
    justify-content: flex-end;
}
.tl-msg-row.assistant {
    justify-content: flex-start;
}
.tl-msg-bubble {
    max-width: 88%;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 0.88rem;
    line-height: 1.55;
    word-break: break-word;
}
.tl-msg-bubble.user {
    background: #22d3ee;
    color: #0b111e;
    font-weight: 600;
    border-bottom-right-radius: 3px;
}
.tl-msg-bubble.assistant {
    background: #131d31;
    border: 1px solid #1e293b;
    color: #e2e8f0;
    border-bottom-left-radius: 3px;
}
.tl-msg-timestamp {
    font-size: 0.7rem;
    color: #64748b;
    margin-top: 6px;
    text-align: right;
}
.tl-chips-container {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 10px;
}
.tl-prompt-chip {
    background: #0d1627;
    border: 1px solid #1e293b;
    color: #38bdf8;
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 0.78rem;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s ease;
}
.tl-prompt-chip:hover {
    background: #14223d;
    border-color: #38bdf8;
    color: #ffffff;
}

/* Footer */
.tl-assistant-footer {
    padding: 12px 16px 14px;
    background: #0a111c;
    border-top: 1px solid #1e293b;
}
.tl-input-form {
    display: flex;
    align-items: center;
    gap: 8px;
}
.tl-chat-input {
    flex: 1;
    background: #0e1726;
    border: 1px solid #1e293b;
    border-radius: 9999px;
    padding: 10px 16px;
    color: #ffffff;
    font-family: var(--font-body);
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.15s ease;
}
.tl-chat-input:focus {
    border-color: #22d3ee;
}
.tl-send-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #22d3ee;
    color: #0b111e;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
    flex-shrink: 0;
}
.tl-send-btn:hover {
    background: #38bdf8;
    transform: scale(1.05);
}
.tl-send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
.tl-footer-caption {
    font-size: 0.72rem;
    color: #64748b;
    text-align: center;
    margin-top: 8px;
}
@media (max-width: 480px) {
    .tl-floating-trigger-container {
        bottom: 14px;
        right: 14px;
    }
    .tl-assistant-trigger-btn {
        width: 44px;
        height: 44px;
    }
    .tl-assistant-trigger-btn svg {
        width: 24px;
        height: 24px;
    }
    .tl-assistant-panel {
        bottom: 78px;
        right: 12px;
        left: 12px;
        width: auto;
        max-width: none;
        height: calc(100vh - 100px);
        max-height: 560px;
        border-radius: 14px;
    }
    .tl-msg-bubble {
        max-width: 92%;
        font-size: 0.85rem;
    }
    .tl-prompt-chip {
        font-size: 0.75rem;
        padding: 6px 10px;
    }
}
</style>

<script>
(function() {
    var triggerBtn = document.getElementById("floating-assistant-btn");
    var panel = document.getElementById("assistant-chat-panel");
    var closeBtn = document.getElementById("assistant-panel-close-btn");
    var minimizeBtn = document.getElementById("assistant-panel-minimize-btn");
    var messagesStream = document.getElementById("assistant-messages-stream");
    var chatForm = document.getElementById("assistant-chat-form");
    var chatInput = document.getElementById("assistant-chat-input");
    var sendBtn = document.getElementById("assistant-send-btn");
    var chips = document.querySelectorAll(".tl-prompt-chip");

    var historyList = [];

    function openAssistant() {
        if (!panel) return;
        panel.classList.add("is-open");
        if (triggerBtn) triggerBtn.setAttribute("aria-expanded", "true");
        setTimeout(function() {
            if (chatInput) chatInput.focus();
        }, 100);
        scrollToBottom();
    }

    function closeAssistant() {
        if (!panel) return;
        panel.classList.remove("is-open");
        if (triggerBtn) triggerBtn.setAttribute("aria-expanded", "false");
    }

    if (triggerBtn) {
        triggerBtn.addEventListener("click", function() {
            if (panel.classList.contains("is-open")) {
                closeAssistant();
            } else {
                openAssistant();
            }
        });
    }

    if (closeBtn) closeBtn.addEventListener("click", closeAssistant);
    if (minimizeBtn) minimizeBtn.addEventListener("click", closeAssistant);

    function scrollToBottom() {
        if (messagesStream) {
            messagesStream.scrollTop = messagesStream.scrollHeight;
        }
    }

    function formatTime() {
        var d = new Date();
        var h = d.getHours();
        var m = d.getMinutes();
        var ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12;
        h = h ? h : 12;
        m = m < 10 ? '0' + m : m;
        return (h < 10 ? '0' + h : h) + ':' + m + ' ' + ampm;
    }

    function renderFormattedText(txt) {
        // Safe basic markdown parsing for bold, bullets, links, linebreaks
        var safe = txt
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

        // Bold **word**
        safe = safe.replace(/\*\*(.*?)\*\*/g, '<strong style="color:#ffffff;">$1</strong>');

        // Markdown links [title](url)
        safe = safe.replace(/\[(.*?)\]\((https?:\/\/.*?)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:#22d3ee; text-decoration:underline;">$1</a>');

        // Line breaks
        safe = safe.replace(/\n/g, '<br>');

        return safe;
    }

    function appendMessage(role, text) {
        var row = document.createElement("div");
        row.className = "tl-msg-row " + role;

        var bubble = document.createElement("div");
        bubble.className = "tl-msg-bubble " + role;

        if (role === "assistant") {
            bubble.innerHTML = renderFormattedText(text);
        } else {
            bubble.textContent = text;
        }

        var timeEl = document.createElement("div");
        timeEl.className = "tl-msg-timestamp";
        timeEl.textContent = formatTime();
        bubble.appendChild(timeEl);

        row.appendChild(bubble);
        messagesStream.appendChild(row);
        scrollToBottom();
    }

    function getCookie(name) {
        var value = "; " + document.cookie;
        var parts = value.split("; " + name + "=");
        if (parts.length === 2) return parts.pop().split(";").shift();
        return "";
    }

    async function sendQuestion(q) {
        var question = q || (chatInput ? chatInput.value.trim() : "");
        if (!question) return;

        appendMessage("user", question);
        if (chatInput) chatInput.value = "";
        if (sendBtn) sendBtn.disabled = true;

        var contextEl = document.getElementById("truthlens-assistant-context");
        var currentAnalysisId = contextEl ? contextEl.getAttribute("data-analysis-id") : null;

        var indicator = document.createElement("div");
        indicator.id = "assistant-typing-indicator";
        indicator.className = "tl-msg-row assistant";
        indicator.innerHTML = '<div class="tl-msg-bubble assistant" style="font-style: italic; color: #38bdf8;">⏳ TruthLens Assistant is verifying...</div>';
        messagesStream.appendChild(indicator);
        scrollToBottom();

        try {
            var resp = await fetch("{% url 'ask_assistant' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken")
                },
                body: JSON.stringify({
                    question: question,
                    analysis_id: currentAnalysisId || null,
                    history: historyList.slice(-6)
                })
            });

            indicator.remove();
            if (sendBtn) sendBtn.disabled = false;

            var data = await resp.json();
            var answer = data.answer || "I received your question, but could not produce a clear explanation. Please try again.";
            appendMessage("assistant", answer);

            historyList.push({ role: "user", content: question });
            historyList.push({ role: "assistant", content: answer });

        } catch (err) {
            indicator.remove();
            if (sendBtn) sendBtn.disabled = false;
            appendMessage("assistant", "I'm having trouble connecting right now. Please try again in a moment.");
        }
    }

    if (chatForm) {
        chatForm.addEventListener("submit", function(e) {
            e.preventDefault();
            sendQuestion();
        });
    }

    chips.forEach(function(chip) {
        chip.addEventListener("click", function() {
            var prompt = this.getAttribute("data-prompt");
            sendQuestion(prompt);
        });
    });

    window.openTruthLensAssistant = function(opts) {
        openAssistant();
        if (opts && opts.prompt) {
            sendQuestion(opts.prompt);
        }
    };
})();
</script>
